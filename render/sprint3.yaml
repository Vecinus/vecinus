# Blueprint for Sprint 3 - Based on Sprint 1 Export
version: "1"
projects:
  - name: Vecinus
    environments:
      - name: Sprint3
        services:
          - type: web
            name: Vecinus-S3
            runtime: static
            repo: https://github.com/Vecinus/vecinus
            branch: chore/blueprints-s3
            envVars:
              - key: EXPO_PUBLIC_BACKEND_URL
                sync: false
            buildCommand: npm install && npx expo export --platform web
            staticPublishPath: dist
            autoDeployTrigger: "off"
            rootDir: frontend

          - type: web
            name: Vecinus-Backend-S3
            runtime: docker
            repo: https://github.com/Vecinus/vecinus
            branch: chore/blueprints-s3
            plan: free
            envVars:
              - key: GEMINI_API_KEY
                sync: false
              - key: PINECONE_INDEX_NAME
                sync: false
              - key: PINECONE_ENVIRONMENT
                sync: false
              - key: PINECONE_API_KEY
                sync: false
              - key: SUPABASE_SCHEMA
                value: dev_s2
              - key: SUPABASE_SERVICE_KEY
                sync: false
              - key: SUPABASE_KEY
                sync: false
              - key: SUPABASE_URL
                sync: false
              - key: SUPABASE_JWT_SECRET
                sync: false
              - key: CLOUDINARY_URL
                sync: false
              - key: RESEND_API_KEY
                sync: false
              - key: APP_BASE_URL
                sync: false
              - key: GOCARDLESS_ACCESS_TOKEN
                sync: false
              - key: GOCARDLESS_BASE_URL
                sync: false
              - key: GOCARDLESS_VERSION
                sync: false
              - key: GOCARDLESS_SCHEME
                sync: false
              - key: GOCARDLESS_EXIT_URI
                sync: false
              - key: MULTICOMMUNITY_CURRENCY
                sync: false
              - key: REGISTRATION_PAYMENT_AMOUNT_CENTS
                sync: false
            region: frankfurt
            healthCheckPath: /health
            dockerContext: .
            dockerfilePath: ./Dockerfile
            autoDeployTrigger: "off"
            rootDir: backend
